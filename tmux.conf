# remap prefix
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# 1 based indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status interval
set status-interval 1

# Set vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Fuzzy find with terminal sessionizer
bind-key f run-shell "tmux neww $HOME/.config/tmux/tmux_sessionizer"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# Using fzf for session selection
bind-key s run-shell "tmux switch-client -t \"\$(tmux list-sessions | fzf | awk '{print \$1}')\""

# Tmux plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Theme — hypersubatomic
set -g status-position top
set -g status-justify left
set -g status-style "fg=#bababa,bg=#0f111a"
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#[fg=#875afb,bold] #S #[default]"
set -g status-right ""

set -g cursor-colour "#ffffff"

set -g window-status-separator " "
set -g pane-border-style "fg=#3b3f51"
set -g pane-active-border-style "fg=#ffc200"
set -g message-style "fg=#0f111a,bg=#ffc200"
set -g message-command-style "fg=#0f111a,bg=#ffc200"
set -g mode-style "fg=#0f111a,bg=#875afb"
set -g display-panes-active-colour "#bababa"
set -g display-panes-colour "#ffc200"

# Vim-like pane switching bind -r ^ last-window
set -g @plugin 'christoomey/vim-tmux-navigator'
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Nerdfont window panes
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @tmux-nerd-font-window-name-show-name true

run '~/.config/tmux/plugins/tpm/tpm'

# Bracket my window names
set -g window-status-format "#[fg=#8f93a2][#I #W]"
set -g window-status-current-format "#[fg=#ffc200,bold][#I #W]"

# Passthrough for clip
set -g set-clipboard on
set -s set-clipboard on
set -g allow-passthrough on
set -s allow-passthrough on
